*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.85;font-size:16px}
.wrap{max-width:720px;margin:0 auto}
header{background:var(--hero);color:var(--hero-ink);padding:26px 18px 22px}

main{padding:20px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}

label{display:block;font-weight:600;margin:12px 0 4px}

button,.btn{font:inherit;cursor:pointer}
.go,.btn{display:inline-block;font-weight:700;margin-top:14px;padding:11px 22px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);text-decoration:none}
.go:disabled{opacity:.45;cursor:not-allowed}
.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:7px;border-radius:7px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.dn{background:var(--brand)}
.meta{color:var(--muted);font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.f{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ex{margin:12px 0;padding:12px 14px;border-radius:10px;background:var(--bg);border-right:4px solid var(--accent)}
.q{font-size:18px;font-weight:700;margin:0 0 12px}
.opt{display:block;width:100%;text-align:right;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.exp{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--bg);border-right:4px solid var(--accent)}
.score{font-size:52px;font-weight:800;color:var(--brand);line-height:1.2}
.res{border:2px dashed var(--accent);border-radius:12px;padding:14px;margin-top:12px}
.res div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.res div:last-child{border:0}
.note{color:var(--muted);font-size:14px}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.pk{display:grid;gap:10px}.pk button{padding:16px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font-size:17px}

.ls button:disabled{opacity:.5;cursor:not-allowed}.ls em{font-style:normal;color:var(--brand);font-weight:700;white-space:nowrap}
.tw{overflow-x:auto}.tb{border-collapse:collapse;width:100%;font-size:14px}.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}

header{position:relative;overflow:hidden}
header .wrap{position:relative}
header .dec{position:absolute;color:var(--accent);opacity:.25;pointer-events:none}
.go svg{width:18px;height:18px;vertical-align:-3px;margin-inline-start:6px}

footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.wm{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;flex-wrap:wrap;gap:34px 46px;align-content:center;justify-content:center;transform:rotate(-22deg) scale(1.4);opacity:.07;font-weight:800;font-size:20px;overflow:hidden;color:var(--ink)}
.err{color:var(--bad);font-weight:700;font-size:14px;margin:6px 0 0}
.go.big{display:block;width:100%;padding:15px 22px;font-size:18px;margin-top:20px}
.fbk{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid}
.fbk.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.fbk.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fi{font-size:26px;line-height:1;animation:pop .35s}
.fe{color:var(--ink);font-weight:400;margin-top:4px}

function R(a){return a[Math.floor(Math.random()*a.length)]}
function sh(a){a=a.slice();for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1)),t=a[n];a[n]=a[j];a[j]=t}return a}
function fm(x){return String(parseFloat(x.toFixed(2)))}
function num(q,ans,u,e,mx,trap){
 var set=[ans],c=sh([ans*2,ans/2,ans*4,ans/4,ans*3,ans+1,ans+.5,ans+2,ans+10]);

 for(var i=0;i<c.length&&set.length<4;i++){var v=parseFloat(c[i].toFixed(2));if(v>0&&v<=(mx||1e9)&&set.indexOf(v)<0)set.push(v)}
 for(var k=1;set.length<4;k++){var w=parseFloat((ans*(1+k/10)).toFixed(2));if(w<=(mx||1e9)&&set.indexOf(w)<0)set.push(w);else{w=parseFloat((ans*(1-k/20)).toFixed(2));if(w>0&&set.indexOf(w)<0)set.push(w)}}
 set=sh(set);
 return{q:q,o:set.map(function(v){return fm(v)+" "+u}),a:set.indexOf(ans),e:e}}
function g1(){var t=R([50,100,200,250,400]),p=R([5,10,20,25]),s=t*p/100,w=t-s;
 return num("أُذيب "+fm(s)+" جم من مادة في "+fm(w)+" جم ماء. ما النسبة المئوية بالكتلة للمذاب؟",p,"%","كتلة المحلول = "+fm(s)+" + "+fm(w)+" = "+t+" جم، والنسبة = "+fm(s)+" ÷ "+t+" × 100 = "+p+"%.",100)}
function g2(){var n=R([.5,1,1.5,2,2.5]),V=R([.5,1,2]),m=n*40,M=n/V;
 return num("أُذيب "+m+" جم من NaOH (الكتلة المولية 40 جم/مول) في الماء ليصبح حجم المحلول "+V+" لتر. ما مولاريته؟",M,"M","n = "+m+" ÷ 40 = "+n+" مول، ثم M = "+n+" ÷ "+V+" = "+fm(M)+" M.",1e9,n)}
function g3(){var n=R([.5,1,2,3]),k=R([.5,1,2]),m=n/k;
 return num("أُذيب "+n+" مول من مادة في "+k+" كجم من الماء. ما مولالية المحلول؟",m,"m","m = مولات المذاب ÷ كتلة المذيب بالكجم = "+n+" ÷ "+k+" = "+fm(m)+" m.")}
function g4(){var M1=R([6,8,12]),M2=R([1,2,3,4].filter(function(x){return x<M1&&M1%x===0})),V1=R([50,100,200]),V2=M1*V1/M2,w=V2-V1;
 return num("أُخذ "+V1+" مل من محلول تركيزه "+M1+" M وأُضيف إليه ماء حتى صار تركيزه "+M2+" M. كم مل ماء أُضيف؟",w,"مل","M₁V₁ = M₂V₂ ⇒ "+M1+" × "+V1+" = "+M2+" × V₂ ⇒ V₂ = "+V2+" مل، والماء المضاف = "+V2+" − "+V1+" = "+w+" مل.",1e9,V2)}
function g5(){var p=R([[1,3],[1,1],[2,2],[3,1],[2,6],[1,4],[3,7]]),x=p[0]/(p[0]+p[1]);
 return num("محلول فيه "+p[0]+" مول من المذاب و "+p[1]+" مول من المذيب. ما الكسر المولي للمذاب؟",x,"","X = "+p[0]+" ÷ ("+p[0]+" + "+p[1]+") = "+fm(x)+".",1)}
var CB=[
{q:"محلول فيه كمية كبيرة من المذاب في حجم صغير، يوصف بأنه؟",o:["مركّز","مخفّف","معلّق","غير متجانس"],a:0,e:"المحلول المركّز يحتوي مذاباً كثيراً نسبةً إلى حجمه."},
{q:"أي التعبيرات الآتية يعتمد على كتلة المذيب بالكيلوجرام؟",o:["المولارية","المولالية","النسبة المئوية بالحجم","الكسر المولي"],a:1,e:"المولالية = مولات المذاب ÷ كتلة المذيب (كجم)."},
{q:"عند تخفيف محلول بإضافة الماء، يبقى ثابتاً؟",o:["عدد مولات المذاب","حجم المحلول","التركيز","كتلة المحلول"],a:0,e:"الماء لا يضيف مذاباً، لذلك M₁V₁ = M₂V₂."},

var SEC12=[
{t:"ما معنى التركيز؟",h:"<p>التركيز يخبرنا كم من المذاب موجود في كمية معينة من المحلول أو المذيب. نصف المحلول وصفاً عاماً: <b>مركّز</b> إن احتوى مذاباً كثيراً، و<b>مخفّف</b> إن احتوى مذاباً قليلاً.</p><p>لكن الوصف العام لا يكفي في الكيمياء، فنعبّر عن التركيز بأرقام: نسبة مئوية، أو مولارية، أو مولالية، أو كسر مولي.</p>",
 c:{q:"أي العبارات الآتية تمثّل وصفاً كمّياً للتركيز؟",o:["محلول مركّز","محلول فاتح اللون","المولارية = 2 M","محلول حلو المذاق"],a:2,e:"الوصف الكمّي يعطي رقماً، مثل المولارية 2 M."}},
{t:"النسبة المئوية بالكتلة",h:"<p>هي نسبة كتلة المذاب إلى كتلة المحلول كله:</p><p><span class='f'>% بالكتلة = كتلة المذاب ÷ كتلة المحلول × 100</span></p><p>وكتلة المحلول = كتلة المذاب + كتلة المذيب.</p><div class='ex'><b>مثال:</b> أُذيب 15 جم ملح في 135 جم ماء. كتلة المحلول = 150 جم، والنسبة = 15 ÷ 150 × 100 = <b>10%</b>.</div>",
 c:{q:"محلول فيه 20 جم مذاب و 80 جم مذيب. ما كتلة المحلول؟",o:["100 جم","80 جم","20 جم","60 جم"],a:0,e:"20 + 80 = 100 جم."}},
{t:"المولارية",h:"<p>المولارية هي عدد مولات المذاب في لتر واحد من <b>المحلول</b>:</p><p><span class='f'>M = n ÷ V(L)</span> &nbsp; و &nbsp; <span class='f'>n = الكتلة ÷ الكتلة المولية</span></p><div class='ex'><b>مثال:</b> أُذيب 58.5 جم NaCl (الكتلة المولية 58.5) ليصير حجم المحلول 2 لتر. n = 58.5 ÷ 58.5 = 1 مول، إذن M = 1 ÷ 2 = <b>0.5 M</b>.</div>",
 c:{q:"عند حساب المولارية نقسم عدد مولات المذاب على؟",o:["حجم المحلول باللتر","كتلة المذيب بالكجم","كتلة المحلول بالجرام","حجم المذيب بالمل"],a:0,e:"المولارية تعتمد على حجم المحلول باللتر."}},
{t:"المولالية والكسر المولي",h:"<p><span class='f'>m = مولات المذاب ÷ كتلة المذيب (كجم)</span></p><p><span class='f'>X = مولات المادة ÷ المولات الكلية في المحلول</span></p><p>المولالية تعتمد على الكتلة، فلا تتأثر بتغير درجة الحرارة، بعكس المولارية التي يتغير حجمها بالحرارة.</p><div class='ex'><b>مثال:</b> 2 مول مذاب في 4 كجم ماء ⇒ m = 2 ÷ 4 = <b>0.5 m</b>.</div>",
 c:{q:"ما الفرق الأساسي بين المولالية والمولارية؟",o:["المولالية بدلالة كتلة المذيب (كجم) والمولارية بدلالة حجم المحلول (لتر)","المولالية بدلالة حجم المحلول والمولارية بدلالة كتلة المذيب","لا فرق بينهما","المولالية تُقاس بالجرام"],a:0,e:"انتبه للمقام: كجم مذيب في المولالية، ولتر محلول في المولارية."}},
{t:"التخفيف",h:"<p>عند إضافة ماء إلى محلول يزداد حجمه ويقل تركيزه، لكن عدد مولات المذاب يبقى ثابتاً. لذلك:</p><p><span class='f'>M₁V₁ = M₂V₂</span></p><div class='ex'><b>مثال:</b> 100 مل من محلول 6 M نخففه إلى 2 M. 6 × 100 = 2 × V₂ ⇒ V₂ = 300 مل، فالماء المضاف = 300 − 100 = <b>200 مل</b>.</div>",
 c:{q:"عند تخفيف محلول بالماء، ما الذي يتغير؟",o:["عدد مولات المذاب","حجم المحلول وتركيزه","نوع المذاب","كتلة المذاب"],a:1,e:"الحجم يزداد والتركيز يقل، أما مولات المذاب فثابتة."}}

{t:"الظاهرة الكهروضوئية وطيف الانبعاث",h:"<p>الظاهرة الكهروضوئية: انبعاث إلكترونات من سطح فلز عند سقوط ضوء عليه بتردد لا يقل عن حد معين، وتفسَّر بأن الضوء يتكوّن من فوتونات.</p><p>أما طيف الانبعاث الذري فهو خطوط ملونة محددة، وهو <b>خاص بكل عنصر</b>.</p>",c:{q:"طيف الانبعاث الخطي لعنصر ما؟",o:["خاص بهذا العنصر","واحد لجميع العناصر","مستمر دائماً","غير موجود"],a:0,e:"كل عنصر له خطوط طيف مميزة."}}];

{t:"النموذج الكمي للذرة",h:"<p>للإلكترون سلوك موجي (فرضية دي برولي)، ولا يمكن تحديد موضعه وسرعته معاً بدقة (<b>مبدأ عدم اليقين لهايزنبرج</b>). لذلك نصف الإلكترون باحتمال وجوده في منطقة تسمى <b>الفلك</b>.</p>",c:{q:"مبدأ عدم اليقين لهايزنبرج يخص؟",o:["تحديد موضع الإلكترون وسرعته معاً","عدد النيوترونات","كتلة الذرة","لون الضوء"],a:0,e:"لا يمكن تحديد الموضع والسرعة معاً بدقة تامة."}},

var S213=[

function ionQ(){var e=R(IONS),w=sh([1,2,3,-1,-2,-3].filter(function(c){return c!==e[2]})).slice(0,3);return mc('ما الأيون الأكثر شيوعاً الذي تكوّنه ذرة '+e[0]+' (العدد الذري '+e[1]+')؟',ionS(e[0],e[2]),w.map(function(c){return ionS(e[0],c)}),'تصل الذرة إلى التوزيع المستقر للغاز النبيل، فتكوّن '+ionS(e[0],e[2])+'.')}
function ionE(){var e=R(IONS),ans=e[1]-e[2],w=sh([-3,-2,-1,0,1,2,3].map(function(d){return e[1]+d}).filter(function(x){return x!==ans&&x>0})).slice(0,3).map(String);return mc('كم إلكتروناً في أيون '+ionS(e[0],e[2])+' (العدد الذري للذرة '+e[1]+')؟',String(ans),w,'عدد الإلكترونات = العدد الذري − الشحنة = '+e[1]+' − ('+e[2]+') = '+ans+'.')}

function nmQ(){var c=R(CAT),a=R(AN),g=gcd(c[1],a[1]),f=frm(c,a,a[1]/g,c[1]/g),nm=a[2]+' '+c[2],c2=R(CAT.filter(function(x){return x!==c})),a2=R(AN.filter(function(x){return x!==a}));return mc('ما اسم المركب الأيوني '+f+'؟',nm,[a[2]+' '+c2[2],a2[2]+' '+c[2],c[2]+' '+a[2]],'يُذكر الأنيون أولاً ثم الكاتيون: '+nm+'.')}

var VE={H:1,C:4,N:5,O:6,F:7,Cl:7,S:6,P:5},AW={C:12,H:1,O:16,N:14,P:31};

function evQ(){var p=R(EVL),parts=[],t=0;Object.keys(p[1]).forEach(function(k){parts.push(p[1][k]+'×'+VE[k]);t+=p[1][k]*VE[k]});return mc('كم مجموع إلكترونات التكافؤ في جزيء '+p[0]+'؟',String(t),[t+2,t-2,t+4].map(String),'نجمع إلكترونات تكافؤ كل الذرات: '+parts.join(' + ')+' = '+t+'.')}
var SHP=[['CO₂','خطي'],['BeCl₂','خطي'],['HCl','خطي'],['BF₃','مثلث مستوٍ'],['CH₄','رباعي الأوجه'],['CCl₄','رباعي الأوجه'],['NH₃','هرمي ثلاثي'],['H₂O','منحنٍ']];
function shpQ(){var p=R(SHP);return mc('ما الشكل الهندسي لجزيء '+p[0]+'؟',p[1],sh(['خطي','منحنٍ','مثلث مستوٍ','رباعي الأوجه','هرمي ثلاثي'].filter(function(x){return x!==p[1]})).slice(0,3),'حسب نظرية VSEPR وعدد أزواج الإلكترونات حول الذرة المركزية، شكله '+p[1]+'.')}
function angQ(){var p=R([['خطي','180°'],['مثلث مستوٍ','120°'],['رباعي الأوجه','109.5°']]);return mc('ما الزاوية بين الروابط في الشكل '+p[0]+' المثالي؟',p[1],['180°','120°','109.5°','90°'].filter(function(x){return x!==p[1]}),'الزاوية في الشكل '+p[0]+' هي '+p[1]+'.')}

function mpQ(){var p=R(MP);return mc('جزيء '+p[0]+' هو؟',p[1],['قطبي','غير قطبي','أيوني','فلزي'].filter(function(x){return x!==p[1]}),p[1]==='قطبي'?'روابطه قطبية وشكله غير متماثل، فهو قطبي.':'روابطه غير قطبية أو أن قطبيتها تتلاشى بتماثل الشكل، فهو غير قطبي.')}

function mfQ(){var e=R(EMP),b=e[0],n=R(e[1]),M=fmass(b)*n,ok=fstr(b,n),w=sh(uniq([1,2,3,4,5,6].filter(function(k){return k!==n}).map(function(k){return fstr(b,k)}))).slice(0,3);return mc('الصيغة الأولية لمركب هي '+fstr(b,1)+' وكتلته المولية '+M+' جم/مول. ما صيغته الجزيئية؟',ok,w,'كتلة الصيغة الأولية = '+fmass(b)+'، و n = '+M+' ÷ '+fmass(b)+' = '+n+'، فالصيغة '+ok+'.')}
